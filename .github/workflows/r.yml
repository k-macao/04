# 手动复制版（股票研报 · 港股/A股）
# 覆盖到 .github/workflows/r.yml 后，到 Actions 页面手动 Run workflow。
# 匹配 stock_report.py v1.1.0-latest-2026-08-13：
#   输入港股/A股代码 → 实时行情（免 Key）→ 最新功能（新鲜度看板 + 字符模拟图 + 十四平台扫描）
#   → AI 研报 / 机构级九章投研 / Skills Hub → 多通道推送。

name: Manual Run - Stock Report (HK/A-share)

on:
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码（港股 5 位 / A股 6 位，如 09988、600519、000001.SZ、sh600519）'
        required: true
        default: '09988'
      template:
        description: '研报分析框架（默认 equity=机构级个股投研；initiate/morning_note 等走 Skills Hub）'
        required: true
        default: 'equity'
        type: choice
        options: [equity, analysis, initiate, morning_note, earnings_preview, earnings_update, model_update, thesis, catalysts, sector, ideas, brief, fusion, plan, picker, scan, earnings, portfolio, review, regime, sentiment, feedscan, newsnow]
      mode:
        description: 'equity 栏目模式（仅 template=equity 生效：full=完整九章 / earnings=财报九章）'
        required: true
        default: 'full'
        type: choice
        options: [full, earnings]
      channel:
        description: '推送通道'
        required: true
        default: 'pushplus'
        type: choice
        options: [pushplus, wecom, serverchan, console, all]
      ai_provider:
        description: 'AI 提供商（auto=自动：有 DeepSeek Key 用 deepseek，否则 rule）'
        required: true
        default: 'auto'
        type: choice
        options: [auto, deepseek, openai, rule]
      dry_run:
        description: 'true=只生成打印到日志不推送；false=真实推送'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      theme:
        description: '推送主题（仅 pushplus）'
        required: true
        default: 'game'
        type: choice
        options: [game, klein, pixel, monitor, noc, default]
      hours:
        description: '数据窗口小时数（量价舆情 / 十四平台扫描）'
        required: true
        default: '48'
        type: choice
        options: ['24', '48', '72', '156']
      risk:
        description: '风险偏好（仅 portfolio 模板）'
        required: true
        default: 'mid'
        type: choice
        options: [low, mid, high]

permissions:
  contents: read

concurrency:
  group: stock-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore push state (跨运行新鲜度对比)
        uses: actions/cache/restore@v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-

      - name: Check required secrets
        run: >-
          python stock_report.py --check-only
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"

      - name: Dry run (只生成研报，不真实推送)
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python stock_report.py "${{ inputs.code }}"
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"
          --template "${{ inputs.template }}"
          --mode "${{ inputs.mode }}"
          --risk "${{ inputs.risk }}"
          --theme "${{ inputs.theme }}"
          --hours "${{ inputs.hours }}"

      - name: Real push (真实推送到微信)
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python stock_report.py "${{ inputs.code }}"
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"
          --template "${{ inputs.template }}"
          --mode "${{ inputs.mode }}"
          --risk "${{ inputs.risk }}"
          --theme "${{ inputs.theme }}"
          --hours "${{ inputs.hours }}"
          --push

      - name: Save push state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
