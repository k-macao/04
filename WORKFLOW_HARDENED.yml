name: Manual Run - Alibaba PushPlus+DeepSeek
on:
  workflow_dispatch:
    inputs:
      template:
        description: '分析框架（8套框架+简报+多空因子）'
        required: true
        default: 'analysis'
        type: choice
        options: [analysis, brief, scan, picker, fusion, plan, earnings, portfolio, review, regime, sentiment, feedscan]
      dry_run:
        description: 'true=只生成不推送（联调用）；false=真实推送到微信'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      channel:
        description: '推送通道'
        required: true
        default: 'pushplus'
        type: choice
        options: [pushplus, wecom, serverchan, console, all]
      ai_provider:
        description: 'AI 提供商（rule=固定模板，不调用 AI）'
        required: true
        default: 'deepseek'
        type: choice
        options: [deepseek, rule, openai]
      topic:
        description: '分析标的/主题（fusion/plan/earnings 必填个股，如 阿里巴巴；留空用默认）'
        required: false
        default: ''
      hk_code:
        description: '港股代码（接入三源核验行情，如 09988=阿里巴巴H；留空则不取数据）'
        required: false
        default: '09988'
      risk:
        description: '风险偏好档位（仅 portfolio 模板使用）'
        required: true
        default: 'mid'
        type: choice
        options: [low, mid, high]
      theme:
        description: '推送主题（仅 pushplus 通道生效，整体默认 game=8-bit像素游戏风：深夜蓝游戏屏+金色粗框+HP血条+SCORE/LV）；klein=米黄纸底黑细框；pixel=暗色监控大屏'
        required: true
        default: 'game'
        type: choice
        options: [game, klein, default, pixel]
      context:
        description: '背景信息（review 模板=粘贴交易细节；其他模板=补充行情/公告）'
        required: false
        default: ''
      hours:
        description: '数据窗口小时数（analysis/sentiment/feedscan/十四平台扫描 用，默认 48，支持 24/48/72/156）'
        required: false
        default: '48'

# 故障排查：若出现 Service Unavailable / Failed to resolve action download info.
# 这是 GitHub Actions Marketplace CDN 瞬时 503，非本仓库代码问题。
# 社区案例 https://github.com/orgs/community/discussions/65974 显示 runner 会自动
# 退避重试 29s + 11s，仍失败则需手动 Re-run。已通过以下加固降低命中率：
#  - 固定为最广泛缓存的 actions/checkout@v4 + setup-python@v5
#  - 同时 pin 到 commit SHA（防 tag 解析抖动）+ 保留 tag 便于可读性
#  - 最小 permissions、超时与并发控制
# 注：contents 需为 write——推送 K 线图要提交 assets/kline_*.png 回仓库，
#     生成公网 raw URL 供微信加载图片；其余 Secret 仍保持最小暴露。
permissions:
  contents: write

concurrency:
  group: manual-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      TOPIC: ${{ inputs.topic }}
      CONTEXT: ${{ inputs.context }}
    steps:
      # 使用广泛缓存的 v4/v5 + SHA pin，降低 marketplace 503 命中率
      # checkout v4 = 11bd71901bbe5b1630ceea73d27597364c9af683 (tag v4.2.2)
      - name: Checkout code
        uses: actions/checkout@v4  # pin: 11bd71901bbe5b1630ceea73d27597364c9af683

      # setup-python v5 = a26af69be951a213d495a4c3e4e4022e16d87065 (tag v5.6.0)
      # 注意：不要加 cache: 'pip' —— 本仓库无 requirements.txt/pyproject.toml，
      # setup-python 会因找不到依赖文件直接报错（Setup Python 步骤失败，整个 job 中断）。
      - name: Setup Python 3.11
        uses: actions/setup-python@v5  # pin: a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Restore push state (跨运行新鲜度对比)
        uses: actions/cache/restore@v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-

      - name: Check required secrets
        run: >-
          python pushplus_deepseek.py --check-only
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"

      - name: Dry run (只生成内容，不真实推送)
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python pushplus_deepseek.py --dry-run
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"
          --template "${{ inputs.template }}"
          --hk-code "${{ inputs.hk_code }}"
          --risk "${{ inputs.risk }}"
          --theme "${{ inputs.theme }}"
          --hours "${{ inputs.hours }}"

      - name: Real push (真实推送到微信)
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python pushplus_deepseek.py
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"
          --template "${{ inputs.template }}"
          --hk-code "${{ inputs.hk_code }}"
          --risk "${{ inputs.risk }}"
          --theme "${{ inputs.theme }}"
          --hours "${{ inputs.hours }}"

      - name: Save push state (供下次新鲜度对比)
        if: ${{ success() && hashFiles('output/push_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
