# ============================================================================
# 【过渡文件 · 手动复制版】股票研报（港股 / A股 / 美股）
# ----------------------------------------------------------------------------
# 本文件位于「仓库根目录」，GitHub Actions 不会执行它 —— 它只是一个中转/过渡副本。
#
# 使用方法（复制到 main 分支）：
#   1. 复制本文件全部内容；
#   2. 在 main 分支上覆盖写入 .github/workflows/stock-report.yml
#      （或另存为任意文件名，例如 .github/workflows/r.yml）；
#   3. 提交后到 Actions 页面选择 "Manual Run - Stock Report (HK/A-share/US)"
#      → Run workflow 手动触发。
#
# 匹配脚本：stock_report.py（v1.2.0-us-2026-08-14）
#   输入港股/A股/美股代码 → 实时行情（免 Key）→ 最新功能（🧭 新鲜度看板 + 📊 字符模拟图
#   + 🛰 十七平台扫描）→ AI 研报 / 机构级九章投研 / Skills Hub → 多通道推送。
#   【2026-08-14 新增】境外（美股）支持：NVDA / AAPL / aapl.us 等代码自动识别，
#   行情经 us_quote.py 四源采集（腾讯美股主 → 东财美股备 → Yahoo 核验 → Stooq 延迟核验）,
#   研报行情块附「🔁 境外行情四源交叉验证」（中位共识价 ±0.8%/2% 口径、离群源点名）。
#   【2026-08-13 起】社媒热榜 7→10 源并含数据源检查验证数据库（详见 DATA_SOURCES.md）。
#
# 要点：
#   - 默认 template=equity（机构级个股投研独立栏目）；也可选 analysis 等经典模板 /
#     Skills Hub 模板，同样附带上述最新功能；
#   - 行情数据源（腾讯财经 / 东方财富）免 Key，无需配置任何行情 Secret；
#   - ai_provider=auto：配了 DEEPSEEK_API_KEY 走 DeepSeek，否则自动降级 rule
#     规则模板（不耗 API、可离线演示）；
#   - 需真实推送时按所选通道配置 Secret：
#     PUSHPLUS_TOKEN / WECOM_KEY / SERVERCHAN_SENDKEY（AI 另需 DEEPSEEK_API_KEY 等）；
#   - 本工作流不写图片回仓库，permissions.contents 仅需 read；
#   - hours 控制量价舆情 / 十七平台扫描窗口（24 / 48 / 72 / 156）；
#   - actions/cache 持久化 output/push_state.json，供新鲜度看板跨运行对比；
#   - 加固：actions 固定 v4/v5 并 pin 到 commit SHA；不要加 cache: 'pip'
#     （本仓库无 requirements.txt / pyproject.toml，会导致 Setup Python 失败）；
#   - 若遇 "Service Unavailable / Failed to resolve action download info"，
#     见 README「故障排查」章节（Marketplace CDN 瞬时 503，网页 Re-run 即可）。
#
# workflow_dispatch 输入上限为 10 个，本文件正好用满 10 个，新增输入前请先删一个。
# ============================================================================
name: Manual Run - Stock Report (HK/A-share/US)

on:
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码（港股 09988 / A股 600519 / 000001.SZ / 美股 NVDA）'
        required: true
        default: '09988'
        type: string
      template:
        description: '研报框架（默认 equity=机构级九章投研；经典模板同样附带最新功能）'
        required: true
        default: 'equity'
        type: choice
        options:
          - equity
          - analysis
          - brief
          - scan
          - picker
          - fusion
          - plan
          - earnings
          - portfolio
          - review
          - regime
          - sentiment
          - feedscan
          - newsnow
          - initiate
          - earnings_preview
          - earnings_update
          - model_update
          - morning_note
          - catalysts
          - thesis
          - sector
          - ideas
      mode:
        description: 'equity 栏目模式：full=九章深度 / earnings=财报深度'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - earnings
      channel:
        description: '推送通道（console=只打印到日志，不发微信）'
        required: true
        default: 'pushplus'
        type: choice
        options:
          - pushplus
          - wecom
          - serverchan
          - console
          - all
      ai_provider:
        description: 'AI 提供方（auto=有 DEEPSEEK_API_KEY 用 deepseek，否则 rule）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - deepseek
          - openai
          - rule
      theme:
        description: '视觉主题'
        required: true
        default: 'monitor'
        type: choice
        options:
          - monitor
          - noc
          - game
          - klein
          - pixel
          - default
      hours:
        description: '量价舆情 / 十七平台扫描窗口（小时）'
        required: true
        default: '48'
        type: choice
        options:
          - '24'
          - '48'
          - '72'
          - '156'
      risk:
        description: '风险偏好（portfolio 模板生效）'
        required: true
        default: 'mid'
        type: choice
        options:
          - low
          - mid
          - high
      industry:
        description: 'equity 行业附录 slug（留空=自动猜测）'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'true=只生成内容打印到日志（不发微信）；false=真实推送'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: stock-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Generate & Push Stock Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      PYTHONUNBUFFERED: '1'

    steps:
      # actions/checkout@v4（pin 到 commit SHA，防 tag 解析抖动）
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # actions/setup-python@v5 —— 注意：不要加 cache: 'pip'（本仓库无依赖清单）
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Show run config (不打印任何 Secret)
        run: |
          echo "code=${{ inputs.code }} template=${{ inputs.template }} mode=${{ inputs.mode }}"
          echo "channel=${{ inputs.channel }} ai_provider=${{ inputs.ai_provider }}"
          echo "theme=${{ inputs.theme }} hours=${{ inputs.hours }} risk=${{ inputs.risk }}"
          echo "industry=${{ inputs.industry }} dry_run=${{ inputs.dry_run }}"
          python -V

      - name: Restore push state (新鲜度看板跨运行对比)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
          restore-keys: |
            push-state-

      - name: Offline selftest (离线自检)
        run: python stock_report.py --selftest

      - name: Check secrets (只检查配置，不发送)
        continue-on-error: true
        run: |
          python stock_report.py --check-only \
            --channel "${{ inputs.channel }}" \
            --ai-provider "${{ inputs.ai_provider }}"

      - name: Dry run (只生成内容，不推送)
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          python stock_report.py "${{ inputs.code }}" \
            --channel "${{ inputs.channel }}" \
            --ai-provider "${{ inputs.ai_provider }}" \
            --template "${{ inputs.template }}" \
            --mode "${{ inputs.mode }}" \
            --industry "${{ inputs.industry }}" \
            --risk "${{ inputs.risk }}" \
            --theme "${{ inputs.theme }}" \
            --hours "${{ inputs.hours }}"

      - name: Real push (真实推送到微信)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          python stock_report.py "${{ inputs.code }}" \
            --channel "${{ inputs.channel }}" \
            --ai-provider "${{ inputs.ai_provider }}" \
            --template "${{ inputs.template }}" \
            --mode "${{ inputs.mode }}" \
            --industry "${{ inputs.industry }}" \
            --risk "${{ inputs.risk }}" \
            --theme "${{ inputs.theme }}" \
            --hours "${{ inputs.hours }}" \
            --push

      - name: Save push state (供下次新鲜度对比)
        if: ${{ success() && hashFiles('output/push_state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
