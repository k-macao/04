# 手动复制版（股票研报 · 港股/A股）：此文件位于仓库根目录，不会被 GitHub Actions 执行。
# 请将本文件完整内容复制并覆盖到 .github/workflows/r.yml
# （或另存为任意文件名，如 stock_report.yml），再到 Actions 页面手动 Run workflow。
# 匹配 stock_report.py v1.0.1-report-2026-08-13：输入港股/A股代码 → 实时行情（免 Key）→ AI 研报 → 多通道推送。
#
# 要点：
#   - 行情数据源（腾讯财经/东方财富）免 Key，无需配置任何行情 Secret；
#   - ai_provider=auto 时：配了 DEEPSEEK_API_KEY 走 DeepSeek，否则自动降级 rule 规则模板（不耗 API）；
#   - 需真实推送时按所选通道配置对应 Secret（PUSHPLUS_TOKEN / WECOM_KEY / SERVERCHAN_SENDKEY）；
#   - 本工作流不写图片回仓库，permissions.contents 仅需 read。
#   - --ai-provider 直接传 inputs.ai_provider（含 auto）。
#     不要写 `cond && '' || x`：GHA 里空串是假值，auto 会被原样传下去，
#     旧版 argparse 不认 auto 就会 exit 2。现版 stock_report.py 已正式接受 auto。

name: Manual Run - Stock Report (HK/A-share)

on:
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码（港股 5 位 / A股 6 位，如 09988、600519、000001.SZ、sh600519）'
        required: true
        default: '09988'
      template:
        description: '研报分析框架'
        required: true
        default: 'analysis'
        type: choice
        options: [analysis, brief, fusion, plan, picker, scan, earnings, portfolio, review, regime, sentiment, feedscan, newsnow]
      channel:
        description: '推送通道'
        required: true
        default: 'pushplus'
        type: choice
        options: [pushplus, wecom, serverchan, console, all]
      ai_provider:
        description: 'AI 提供商（auto=自动：有 DeepSeek Key 用 deepseek，否则 rule；rule=不耗 API 的固定模板）'
        required: true
        default: 'auto'
        type: choice
        options: [auto, deepseek, openai, rule]
      dry_run:
        description: 'true=只生成打印到日志不推送（联调用）；false=真实推送到微信'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      theme:
        description: '推送主题（仅 pushplus 通道生效；game=8-bit像素游戏风，monitor=服务器大屏风，default=普通 Markdown）'
        required: true
        default: 'game'
        type: choice
        options: [game, klein, pixel, monitor, noc, default]
      risk:
        description: '风险偏好档位（仅 portfolio 模板使用）'
        required: true
        default: 'mid'
        type: choice
        options: [low, mid, high]

permissions:
  contents: read

concurrency:
  group: stock-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
    steps:
      # checkout v4 = 11bd71901bbe5b1630ceea73d27597364c9af683 (tag v4.2.2)
      - name: Checkout code
        uses: actions/checkout@v4  # pin: 11bd71901bbe5b1630ceea73d27597364c9af683

      # setup-python v5 = a26af69be951a213d495a4c3e4e4022e16d87065 (tag v5.6.0)
      # 注意：不要加 cache: 'pip' —— 本仓库无 requirements.txt/pyproject.toml，会导致步骤失败。
      - name: Setup Python 3.11
        uses: actions/setup-python@v5  # pin: a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      # 直接把 auto / deepseek / openai / rule 传给 CLI。
      # stock_report.py 已把 auto 当作「有 DEEPSEEK_API_KEY 用 deepseek，否则 rule」。
      - name: Check required secrets
        run: >-
          python stock_report.py --check-only
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"

      - name: Dry run (只生成研报，不真实推送)
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python stock_report.py "${{ inputs.code }}"
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"
          --template "${{ inputs.template }}"
          --risk "${{ inputs.risk }}"
          --theme "${{ inputs.theme }}"

      - name: Real push (真实推送到微信)
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python stock_report.py "${{ inputs.code }}"
          --channel "${{ inputs.channel }}"
          --ai-provider "${{ inputs.ai_provider }}"
          --template "${{ inputs.template }}"
          --risk "${{ inputs.risk }}"
          --theme "${{ inputs.theme }}"
          --push
